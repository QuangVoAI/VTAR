[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtr-ai"
version = "0.1.0"
description = "Baseline pipeline for Vietnamese clinical concept normalization."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = []

[project.scripts]
run_infer = "vtr_ai.cli:main"
run_submit = "vtr_ai.submission:main"
train_ner = "vtr_ai.train_ner:main"
infer_ner = "vtr_ai.infer_ner:main"
check_ner_runtime = "vtr_ai.check_ner_runtime:main"
eval_outputs = "vtr_ai.evaluation:main"
analyze_outputs = "vtr_ai.analysis_report:main"
audit_outputs = "vtr_ai.audit_report:main"
run_workflow = "vtr_ai.workflow:main"
bootstrap_annotations = "vtr_ai.bootstrap_annotations:main"
review_to_gold = "vtr_ai.review_to_gold:main"
gold_to_ner_jsonl = "vtr_ai.gold_to_ner_jsonl:main"
review_subset = "vtr_ai.review_subset:main"
select_review_subset = "vtr_ai.select_review_subset:main"
prepare_dev_subset = "vtr_ai.prepare_dev_subset:main"
review_packet = "vtr_ai.review_packet:main"
review_to_train = "vtr_ai.review_to_train:main"
validate_review_jsonl = "vtr_ai.validate_review_jsonl:main"
build_standard_kb = "vtr_ai.build_standard_kb:main"
audit_knowledge_base = "vtr_ai.audit_knowledge_base:main"
build_icd10_alias_seed = "vtr_ai.build_icd10_alias_seed:main"
prepare_semantic_datasets = "vtr_ai.prepare_semantic_datasets:main"
prepare_qwen_fixed_span_dataset = "vtr_ai.prepare_qwen_fixed_span_dataset:main"
train_qwen_fixed_span = "vtr_ai.train_qwen_fixed_span:main"
infer_qwen_fixed_span = "vtr_ai.infer_qwen_fixed_span:main"
remap_split_spans_to_raw = "vtr_ai.remap_split_spans_to_raw:main"
materialize_bootstrap_raw_subset = "vtr_ai.materialize_bootstrap_raw_subset:main"
materialize_bootstrap_dataset = "vtr_ai.materialize_bootstrap_dataset:main"
analyze_fixed_span_subset = "vtr_ai.analyze_fixed_span_subset:main"
sanity_check_subset_output = "vtr_ai.sanity_check_subset_output:main"
fetch_and_analyze_subset_baseline = "vtr_ai.fetch_and_analyze_subset_baseline:main"
package_subset_output = "vtr_ai.package_subset_output:main"
compare_subset_outputs = "vtr_ai.compare_subset_outputs:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
